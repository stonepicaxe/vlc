name: VLC Multi-OS Build

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux x86_64 (Qt6)
    runs-on: ubuntu-latest
    container:
      image: registry.videolan.org/vlc-debian-unstable:20260611225331
      options: --user root
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 100

      - name: Fix git permissions
        run: git config --global --add safe.directory '*'

      - name: Bootstrap
        run: ./bootstrap

      - name: Configure
        run: |
          ./configure \
            --disable-nls \
            --disable-lua \
            --disable-a52 \
            --enable-qt \
            --disable-skins2

      - name: Compile
        run: make -j$(nproc)

      - name: Package Linux Installation
        run: |
          make install DESTDIR=$(pwd)/vlc-linux-install
          tar -czf vlc-linux-x86_64.tar.gz -C vlc-linux-install .

      - name: Upload Linux Package
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: vlc-linux-package
          path: |
            vlc-linux-x86_64.tar.gz
            modules/gui/qt/.libs/libqt_plugin.so
          if-no-files-found: ignore

  windows:
    name: Windows x86_64 (Qt6 MinGW)
    runs-on: ubuntu-latest
    container:
      image: registry.videolan.org/vlc-debian-win64-posix:20260611225331
      options: --user root
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 100

      - name: Fix git permissions
        run: git config --global --add safe.directory '*'

      - name: Resolve Prebuilt Contribs
        run: |
          FOUND_URL=""
          for sha in $(git rev-list -n 20 HEAD -- extras/tools contrib extras/ci extras/package/win32); do
            url="https://artifacts.videolan.org/vlc/win64/vlc-contrib-x86_64-w64-mingw32-${sha}.tar.zst"
            if extras/ci/check-url.sh "$url" 2>/dev/null; then
              FOUND_URL="$url"
              echo "VLC_CONTRIB_SHA=${sha}" >> $GITHUB_ENV
              echo "VLC_PREBUILT_CONTRIBS_URL=${FOUND_URL}" >> $GITHUB_ENV
              echo "Found valid prebuilt contribs: ${sha} -> ${FOUND_URL}"
              break
            fi
          done
          if [ -z "$FOUND_URL" ]; then
            echo "ERROR: No valid prebuilt contrib found on VideoLAN artifacts server"
            exit 1
          fi

      - name: Build Windows VLC and Installer
        run: |
          extras/package/win32/build.sh -a x86_64 -p -i r

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: vlc-windows-installer
          path: |
            win64/vlc-*.exe
            win64/vlc-*.zip
            win64/modules/gui/qt/.libs/libqt_plugin.dll
          if-no-files-found: ignore

  macos:
    name: ${{ matrix.name }}
    runs-on: macos-14
    strategy:
      matrix:
        include:
          - name: macOS Intel x86_64
            arch: x86_64
            shortarch: intel64
            triplet_arch: x86_64
            contrib_group: macos-x86_64
            artifact_name: vlc-macos-intel-installer
          - name: macOS Apple Silicon arm64
            arch: aarch64
            shortarch: arm64
            triplet_arch: aarch64
            contrib_group: macos-arm64
            artifact_name: vlc-macos-arm64-installer
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 100

      - name: Install dependencies
        run: |
          brew install autoconf automake libtool pkg-config bison nasm ninja zstd gnu-tar || true
          BREW_PREFIX="$(brew --prefix)"
          echo "$BREW_PREFIX/bin" >> $GITHUB_PATH
          echo "$BREW_PREFIX/opt/bison/bin" >> $GITHUB_PATH
          echo "$BREW_PREFIX/opt/gnu-tar/libexec/gnubin" >> $GITHUB_PATH

      - name: Setup SDK compatibility
        run: |
          ACTUAL_SDK="$(xcrun --sdk macosx --show-sdk-path)"
          echo "Actual SDK: $ACTUAL_SDK"
          SDK_DIR="/Applications/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs"
          sudo mkdir -p "$SDK_DIR"
          sudo ln -sfn "$ACTUAL_SDK" "$SDK_DIR/MacOSX26.2.sdk"
          sudo ln -sfn "$ACTUAL_SDK" "$SDK_DIR/MacOSX.sdk"
          for v in 13 14 15 16 26.2; do
            sudo ln -sfn "$ACTUAL_SDK" "$SDK_DIR/MacOSX${v}.sdk" 2>/dev/null || true
          done
          ls -la "$SDK_DIR"

      - name: Resolve Prebuilt Contribs
        run: |
          export VLC_FORCE_KERNELVERSION=19
          echo "VLC_FORCE_KERNELVERSION=19" >> $GITHUB_ENV
          BREW_PREFIX="$(brew --prefix)"
          echo "VLC_PATH=$BREW_PREFIX/bin:$BREW_PREFIX/sbin:$BREW_PREFIX/opt/bison/bin" >> $GITHUB_ENV
          FOUND_URL=""
          for sha in $(git rev-list -n 20 HEAD -- extras/tools contrib extras/ci extras/package/macosx); do
            url="https://artifacts.videolan.org/vlc/${{ matrix.contrib_group }}/vlc-contrib-${{ matrix.triplet_arch }}-apple-darwin19-${sha}.tar.zst"
            if extras/ci/check-url.sh "$url" 2>/dev/null; then
              FOUND_URL="$url"
              echo "VLC_CONTRIB_SHA=${sha}" >> $GITHUB_ENV
              echo "VLC_PREBUILT_CONTRIBS_URL=${FOUND_URL}" >> $GITHUB_ENV
              echo "Found valid prebuilt contribs: ${sha} -> ${FOUND_URL}"
              break
            fi
          done
          if [ -z "$FOUND_URL" ]; then
            echo "ERROR: No valid prebuilt contrib found on VideoLAN artifacts server"
            exit 1
          fi

      - name: Build macOS VLC and DMG Installer
        run: |
          ./extras/package/macosx/build.sh -a ${{ matrix.arch }} -p -j $(sysctl -n hw.ncpu)

      - name: Upload macOS Installer
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            vlc-*.dmg
            VLC.app
          if-no-files-found: ignore
