name: Build VLC Qt GUI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  build:
    name: Compile Qt Interface
    runs-on: ubuntu-latest
    container:
      image: registry.videolan.org/vlc-debian-unstable:20260611225331
    steps:
      - name: Configure git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Bootstrap
        run: ./bootstrap

      - name: Configure
        run: |
          ./configure \
            --disable-nls \
            --disable-lua \
            --disable-a52 \
            --enable-qt \
            --disable-skins2

      - name: Compile
        run: make -j$(nproc)
